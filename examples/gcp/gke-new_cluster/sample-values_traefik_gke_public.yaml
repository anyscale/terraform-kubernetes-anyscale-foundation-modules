service:
  type: LoadBalancer
  annotations:
    cloud.google.com/load-balancer-type: "External"
providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
  kubernetesGateway:
    enabled: false
ingressClass:
  enabled: true
  isDefaultClass: true
ports:
  web:
    redirectTo:
      port: websecure
  websecure:
    tls:
      enabled: true
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
