---
apiVersion: v1
kind: Service
metadata:
  name: ray-head
spec:
  clusterIP: None
  selector:
    app: ray
    role: head
  ports:
    - name: gcs
      port: 6379
      targetPort: 6379
    - name: dashboard
      port: 8265
      targetPort: 8265
    - name: client
      port: 10001
      targetPort: 10001
---
apiVersion: v1
kind: Pod
metadata:
  name: ray-head
  labels:
    app: ray
    role: head
spec:
  nodeSelector:
    cloud.google.com/gke-nodepool: cpu-head
  restartPolicy: Always
  volumes:
    - name: shared-memory
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
    - name: workspace
      emptyDir:
        sizeLimit: 100Gi
  containers:
    - name: ray
      image: nvcr.io/nvidia/pytorch:25.04-py3
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "8"
          memory: 32Gi
        limits:
          cpu: "14"
          memory: 56Gi
      ports:
        - containerPort: 6379
          name: gcs
        - containerPort: 8265
          name: dashboard
        - containerPort: 10001
          name: client
      volumeMounts:
        - name: shared-memory
          mountPath: /dev/shm
        - name: workspace
          mountPath: /workspace
      command: ["/bin/bash", "-lc"]
      args:
        - |
          if [ -f /etc/ld.so.conf.d/00-cuda-compat.conf ]; then
            mv /etc/ld.so.conf.d/00-cuda-compat.conf /etc/ld.so.conf.d/00-cuda-compat.conf.disabled
            ldconfig
          fi
          sleep infinity

