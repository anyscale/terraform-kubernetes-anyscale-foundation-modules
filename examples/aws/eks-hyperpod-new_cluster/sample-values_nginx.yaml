controller:
  service:
    type: LoadBalancer
    # `service.k8s.aws/nlb` delegates ownership of this Service to the AWS Load
    # Balancer Controller, required on HyperPod (see README). The external NLB in
    # IP target mode registers Pod IPs directly, which works on HyperPod worker
    # nodes whose non-standard providerIDs cannot be registered as `instance`
    # targets. On standard EKS you may instead use the in-tree
    # `aws-load-balancer-type: nlb` annotation.
    loadBalancerClass: service.k8s.aws/nlb
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "external"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
  allowSnippetAnnotations: true
  config:
    enable-underscores-in-headers: true
    annotations-risk-level: "Critical"
  autoscaling:
    enabled: true
