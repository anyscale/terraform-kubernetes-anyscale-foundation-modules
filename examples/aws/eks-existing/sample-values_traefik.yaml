service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
  kubernetesGateway:
    enabled: false
ingressClass:
  enabled: true
  isDefaultClass: true
ports:
  web:
    redirectTo:
      port: websecure
  websecure:
    tls:
      enabled: true
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
