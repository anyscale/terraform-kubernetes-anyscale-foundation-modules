# Ratify CertificateStore — trusts the public Notation signing certificate.
# The certificate is downloaded from the private Key Vault by the jump-host
# harness and rendered inline before kubectl apply (matching the AKS Image
# Integrity Learn-module flow).
# Docs: https://learn.microsoft.com/azure/aks/image-integrity
apiVersion: config.ratify.deislabs.io/v1beta1
kind: CertificateStore
metadata:
  name: certstore-inline
  namespace: gatekeeper-system
spec:
  provider: inline
  parameters:
    value: |
      $ANYSCALE_SIGNING_CERT_PEM
